<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ▼ ページタイトル（ブラウザのタブに表示） -->
  <title>YOUR NAME | VJ / Projection Mapping / Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヘッダー =====
       名前とメニュー。名前は全ページ共通なので、変えるときは3ファイルとも直してください -->
  <header class="site-header">
    <a href="index.html" class="site-name">YOUR NAME</a>
    <nav class="site-nav">
      <a href="works.html">Works</a>
      <a href="about.html">About me</a>
    </nav>
  </header>

  <!-- ===== ヒーロー（スライド） =====
       スライドを増やすときは <div class="slide"> ～ </div> をコピーして追加。
       最初の1枚だけ class に "active" を付けます。
       本物の画像にするなら style の background を
       background: url("images/slide1.jpg") center/cover;
       に差し替えてください。 -->
  <section class="hero">
    <div class="slide active" style="background: linear-gradient(135deg, #1a1a2e, #0f3460);">
      <p class="slide-caption">Work 01 — 仮タイトル</p>
    </div>
    <div class="slide" style="background: linear-gradient(135deg, #2b1055, #7597de);">
      <p class="slide-caption">Work 02 — 仮タイトル</p>
    </div>
    <div class="slide" style="background: linear-gradient(135deg, #000000, #434343);">
      <p class="slide-caption">Work 03 — 仮タイトル</p>
    </div>

    <!-- スクロールを促す表示。クリックで次のセクションへ移動します。
         文字を変えるときは "Scroll" の部分を書き換えてください -->
    <a href="#about" class="scroll-hint" aria-label="下にスクロール">
      <span>Scroll</span>
      <span class="scroll-arrow"></span>
    </a>
  </section>

  <main>
    <!-- ===== 自己紹介（短め） ===== -->
    <section class="section" id="about">
      <h2 class="section-title">About me</h2>
      <!-- ▼ ここの文章を自分の紹介文に書き換え -->
      <p>
        VJ・プロジェクションマッピングを中心に、光と映像で空間を作っています。
        ここに簡単な自己紹介文を入れてください。
      </p>
      <a href="about.html" class="more-link">About me →</a>
    </section>

    <!-- ===== Works（抜粋） ===== -->
    <section class="section">
      <h2 class="section-title">Works</h2>
      <div class="works-grid">
        <!-- 作品を増やすときは <a class="work-card"> ～ </a> をコピー -->
        <!-- href の ?id= は works-data.js の id に合わせます -->
        <a href="work.html?id=work-01" class="work-card">
          <div class="work-thumb"><div class="ph-1"></div></div>
          <p class="work-title">作品タイトル 01</p>
          <p class="work-meta">Projection Mapping / 2025</p>
        </a>
        <a href="work.html?id=work-02" class="work-card">
          <div class="work-thumb"><div class="ph-2"></div></div>
          <p class="work-title">作品タイトル 02</p>
          <p class="work-meta">VJ / 2025</p>
        </a>
      </div>
      <a href="works.html" class="more-link">All works →</a>
    </section>
  </main>

  <footer class="site-footer">
    <!-- ▼ コピーライトの名前を変更 -->
    © 2025 YOUR NAME
  </footer>

  <script src="script.js"></script>
</body>
</html>
