<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-page="Works">Works | YOUR NAME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヘッダー（現在のページに class="current" を付けています） ===== -->
  <header class="site-header static">
    <a href="index.html" class="site-name" data-site="name">YOUR NAME</a>
    <nav class="site-nav">
      <a href="works.html" class="current">Works</a>
      <a href="about.html">About me</a>
    </nav>
    <!-- ハンバーガーボタン（モバイルのみ表示） -->
    <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main class="section works-page">
    <h1 class="page-title">WORKS</h1>

    <!-- ===== カテゴリへのリンク =====
         中身は works.js が自動で作ります（ここは触らなくてOK） -->
    <nav class="category-nav" id="category-nav"></nav>

    <!-- ===== スキルで絞り込み =====
         works-data.js の skills から自動で作られます（クリックで絞り込み、もう一度で解除） -->
    <nav class="skill-nav" id="skill-nav"></nav>

    <!-- ===== 全作品の一覧（2列グリッド） ===== -->
    <!-- PCでは、All の2段目の下端が1画面の下にぴったり収まるよう
         サムネイルの高さを自動調整します（style.css の「Works：1画面に収める」参照） -->
    <section class="works-section" id="all">
      <h2 class="section-title" id="all-title">All</h2>
      <div class="works-grid" id="works-all"></div>
    </section>

    <!-- ===== カテゴリ別の一覧 =====
         作品の追加・編集は works-data.js の WORKS を書き換えてください -->
    <div id="works-categories"></div>
  </main>

  <footer class="site-footer" data-site="copyright">© 2025 YOUR NAME</footer>

  <!-- 作品データ → 表示処理 の順で読み込む（順番を変えないでください） -->
  <script src="site.js"></script>
  <script src="works-data.js"></script>
  <script src="works.js"></script>
  <script src="menu.js"></script>
</body>
</html>
