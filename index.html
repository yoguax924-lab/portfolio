<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ▼ ページタイトル（ブラウザのタブに表示） -->
  <title>YOUR NAME | VJ / Projection Mapping / Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヘッダー =====
       名前とメニュー。名前は全ページ共通なので、変えるときは index / works / about / work の4ファイルとも直してください -->
  <header class="site-header">
    <a href="index.html" class="site-name">YOUR NAME</a>
    <nav class="site-nav">
      <a href="works.html">Works</a>
      <a href="about.html">About me</a>
    </nav>
    <!-- ハンバーガーボタン（モバイルのみ表示） -->
    <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <!-- ===== ヒーロー（スライド） =====
       スライドの中身（画像・キャプション）は works-data.js の SLIDES で編集します。
       ここには書かなくてOK（script.js が自動で作ります） -->
  <section class="hero">

    <!-- スクロールを促す表示。クリックで次のセクションへ移動します。
         文字を変えるときは "Scroll" の部分を書き換えてください -->
    <a href="#about" class="scroll-hint" aria-label="下にスクロール">
      <span>Scroll</span>
      <span class="scroll-arrow"></span>
    </a>
  </section>

  <main>
    <!-- ===== 自己紹介（短め） ===== -->
    <section class="section" id="about">
      <h2 class="section-title">About me</h2>
      <!-- ▼ ここの文章を自分の紹介文に書き換え -->
      <p>
        VJ・プロジェクションマッピングを中心に、光と映像で空間を作っています。
        ここに簡単な自己紹介文を入れてください。
      </p>
      <a href="about.html" class="more-link">About me →</a>
    </section>

    <!-- ===== Works（抜粋） ===== -->
    <section class="section">
      <h2 class="section-title">Works</h2>
      <!-- 作品カードは works-data.js の WORKS の先頭から自動で表示されます
           （表示する数は script.js の HOME_WORKS_COUNT） -->
      <div class="works-grid" id="home-works"></div>
      <a href="works.html" class="more-link">All works →</a>
    </section>
  </main>

  <footer class="site-footer">
    <!-- ▼ コピーライトの名前を変更 -->
    © 2025 YOUR NAME
  </footer>

  <script src="works-data.js"></script>
  <script src="menu.js"></script>
  <script src="script.js"></script>
</body>
</html>
